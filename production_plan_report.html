<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Production Plan Report</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="./production_plan_seed_data.js"></script>
  <script src="./production_plan_engine.js"></script>
  <script src="./simulation_manager.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  <script src="./excel_export.js"></script>
  <script src="./production_plan_rules_engine.js"></script>
  <style>
    @media print {
      .no-print { display: none; }
      .page-break { page-break-after: always; }
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    table { font-variant-numeric: tabular-nums; }
  </style>
</head>
<body class="bg-slate-50">
  <div class="max-w-7xl mx-auto p-6 space-y-6">
    <!-- Header -->
    <div class="bg-white rounded-xl shadow-sm p-6 no-print">
      <div class="flex items-center justify-between">
        <div>
          <h1 class="text-3xl font-bold text-slate-900">Production Plan Report</h1>
          <div id="reportMetadata" class="text-sm text-slate-600 mt-2"></div>
        </div>
        <div class="flex gap-3">
          <button onclick="backToSimulationLibrary()" class="px-4 py-2 bg-purple-600 text-white rounded-lg font-semibold hover:bg-purple-700 flex items-center gap-2">
            <span>📂</span>
            <span>Back to Library</span>
          </button>
          <button onclick="window.print()" class="px-4 py-2 bg-blue-600 text-white rounded-lg font-semibold hover:bg-blue-700 flex items-center gap-2">
            <span>🖨️</span>
            <span>Print</span>
          </button>
          <button onclick="exportToExcel()" class="px-4 py-2 bg-green-600 text-white rounded-lg font-semibold hover:bg-green-700 flex items-center gap-2">
            <span>📊</span>
            <span>Export Excel</span>
          </button>
          <button onclick="window.close()" class="px-4 py-2 border border-slate-300 text-slate-700 rounded-lg font-semibold hover:bg-slate-50">
            Close
          </button>
        </div>
      </div>
    </div>

    <!-- Configuration Summary (if demo data was loaded) -->
    <div id="configInfo" class="hidden bg-gradient-to-r from-blue-50 to-indigo-50 border-2 border-blue-300 rounded-xl p-5 shadow-sm">
      <div class="flex items-start gap-4">
        <span id="reportConfigIcon" class="text-4xl">🚀</span>
        <div class="flex-1">
          <div class="flex items-center gap-3 mb-2">
            <span class="text-lg font-bold text-slate-900" id="reportConfigName">Q4 Ramp-Up (Oct-Dec)</span>
            <span class="px-3 py-1 bg-blue-600 text-white text-xs font-bold rounded-full">DEMO SCENARIO</span>
          </div>
          <div class="text-sm text-slate-700 mb-3" id="reportConfigDescription">National Day holiday, new product ramp, year-end sprint</div>
          <div class="flex flex-wrap gap-2" id="reportConfigHighlights">
            <!-- Highlights will be populated here -->
          </div>
        </div>
      </div>
    </div>

    <!-- Plan Summary -->
    <div id="planSummary" class="bg-white rounded-xl shadow-sm p-6"></div>

    <!-- Weekly Metrics -->
    <div class="bg-white rounded-xl shadow-sm p-6">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-xl font-bold text-slate-900">📊 Weekly Metrics</h2>
        <button onclick="openDailyPlanPage()" class="px-4 py-2 bg-blue-600 text-white rounded-lg font-semibold hover:bg-blue-700 transition flex items-center gap-2">
          <span>📅</span>
          <span>View Daily Plan Details</span>
        </button>
      </div>

      <div class="text-xs text-slate-500 mb-3">
        💡 Scroll horizontally to view all weeks. Cumulative metrics highlighted in blue.
      </div>

      <!-- Weekly Metrics Table (Transposed: Weeks as columns) -->
      <div class="overflow-x-auto border rounded-lg">
        <table id="weeklyMetricsTable" class="text-sm border-collapse">
          <thead>
            <tr></tr>
          </thead>
          <tbody id="weeklyMetricsBody"></tbody>
        </table>
      </div>
    </div>

    <!-- Intelligent Recommendations -->
    <div id="intelligentRecommendations" class="bg-white rounded-xl shadow-sm p-6">
      <h2 class="text-xl font-bold text-slate-900 mb-4">🤖 Intelligent Analysis & Recommendations</h2>
      <div id="recommendationsContent"></div>
    </div>

    <!-- Site Breakdown (if combined mode) -->
    <div id="siteBreakdown" class="bg-white rounded-xl shadow-sm p-6 hidden">
      <h2 class="text-xl font-bold text-slate-900 mb-4">Site Breakdown</h2>
      <div id="siteBreakdownContent"></div>
    </div>
  </div>

  <script>
    // Get plan data from URL parameters or localStorage
    function getPlanData() {
      try {
        const urlParams = new URLSearchParams(window.location.search);
        const planId = urlParams.get('planId');

        console.log('[Report] Plan ID from URL:', planId);

        if (planId) {
          // Load from localStorage
          const planDataStr = localStorage.getItem('productionPlan_' + planId);
          console.log('[Report] Data from localStorage:', planDataStr ? 'Found' : 'Not found');

          if (planDataStr) {
            const planData = JSON.parse(planDataStr);
            console.log('[Report] Parsed plan data:', planData);
            // Handle both old format (direct results) and new format (with config)
            if (planData.results) {
              return planData; // New format
            } else {
              return { results: planData, config: null }; // Old format
            }
          }
        }

        // Fallback: load from window.opener if available
        if (window.opener && window.opener.productionPlanState) {
          console.log('[Report] Loading from window.opener');
          return {
            results: window.opener.productionPlanState.planResults,
            config: window.opener.CURRENT_PLAN_CONFIG || null
          };
        }

        console.error('[Report] No plan data found');
        return null;
      } catch (error) {
        console.error('[Report] Error getting plan data:', error);
        return null;
      }
    }

    function formatNumber(num) {
      return Math.round(num).toLocaleString();
    }

    function formatDate(dateStr) {
      const date = new Date(dateStr + 'T00:00:00');
      return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function openDailyPlanPage() {
      const urlParams = new URLSearchParams(window.location.search);
      const planId = urlParams.get('planId');

      if (planId) {
        window.open(
          'production_plan_daily_details.html?planId=' + planId,
          '_blank',
          'width=1400,height=900,scrollbars=yes,resizable=yes'
        );
      } else {
        alert('No plan data available');
      }
    }

    function renderReport() {
      const planData = getPlanData();

      if (!planData) {
        document.body.innerHTML = `
          <div class="min-h-screen flex items-center justify-center">
            <div class="text-center">
              <div class="text-6xl mb-4">❌</div>
              <div class="text-xl font-bold text-slate-900">No Plan Data Found</div>
              <div class="text-slate-600 mt-2">Please generate a production plan first.</div>
              <button onclick="window.close()" class="mt-4 px-6 py-2 bg-blue-600 text-white rounded-lg font-semibold">
                Close Window
              </button>
            </div>
          </div>
        `;
        return;
      }

      // Show configuration info if available
      if (planData.config) {
        renderConfigInfo(planData.config);
      }

      // Handle both old and new data structure
      const results = planData.results || planData;

      // Determine if combined mode
      const isCombined = results.mode === 'combined';
      const plan = isCombined ? results.constrained : results;

      // Render metadata
      const metadata = document.getElementById('reportMetadata');
      const generatedAt = planData.generatedAt ? new Date(planData.generatedAt).toLocaleString() : new Date().toLocaleString();
      metadata.innerHTML = `
        Generated: ${generatedAt} |
        Mode: ${results.mode || plan.mode} ${isCombined ? '<span class="px-2 py-1 bg-purple-100 text-purple-800 text-xs font-bold rounded ml-2">COMBINED MODE</span>' : ''} |
        Period: ${plan.programResults[0].date} to ${plan.programResults[plan.programResults.length - 1].date}
      `;

      // Render summary (with comparison if combined mode)
      renderSummary(plan, isCombined ? results.unconstrained : null);

      // Daily results moved to separate page - not rendered here anymore

      // Render weekly metrics (with comparison if combined mode)
      renderWeeklyMetrics(plan.weeklyMetrics, isCombined ? results.unconstrained.weeklyMetrics : null);

      // Visual analytics removed - weekly metrics is sufficient

      // Render intelligent recommendations
      renderIntelligentRecommendations(results, planData.config);

      // Render site breakdown if available
      if (plan.siteResults) {
        renderSiteBreakdown(plan.siteResults);
      }
    }

    function renderConfigInfo(config) {
      const card = document.getElementById('configInfo');
      if (!card || !config) return;

      // Only show config info card if all required fields exist
      if (!config.icon || !config.name || !config.description || !config.highlights) {
        // Config doesn't have display metadata, skip rendering this card
        return;
      }

      document.getElementById('reportConfigIcon').textContent = config.icon;
      document.getElementById('reportConfigName').textContent = config.name;
      document.getElementById('reportConfigDescription').textContent = config.description;

      const highlightsContainer = document.getElementById('reportConfigHighlights');
      highlightsContainer.innerHTML = config.highlights.map(h =>
        `<span class="text-xs px-2 py-1 bg-blue-100 text-blue-800 rounded border border-blue-300">${h}</span>`
      ).join('');

      card.classList.remove('hidden');
    }

    function renderSummary(plan, unconstrainedPlan) {
      const container = document.getElementById('planSummary');

      const lastDay = plan.programResults[plan.programResults.length - 1];
      const totalDemand = plan.weeklyMetrics.reduce((sum, w) => sum + w.demand, 0);
      const totalShipment = lastDay.cum_shipment;
      const gap = totalShipment - totalDemand;
      const attainment = totalDemand > 0 ? (totalShipment / totalDemand * 100) : 0;

      let html = '';

      // If Combined Mode, show side-by-side comparison
      if (unconstrainedPlan) {
        const unconstrainedLastDay = unconstrainedPlan.programResults[unconstrainedPlan.programResults.length - 1];
        const unconstrainedTotalDemand = unconstrainedPlan.weeklyMetrics.reduce((sum, w) => sum + w.demand, 0);
        const unconstrainedTotalShipment = unconstrainedLastDay.cum_shipment;
        const unconstrainedGap = unconstrainedTotalShipment - unconstrainedTotalDemand;
        const unconstrainedAttainment = unconstrainedTotalDemand > 0 ? (unconstrainedTotalShipment / unconstrainedTotalDemand * 100) : 0;

        const shipmentStartDate = plan.programResults.find(d => d.shipment_final > 0)?.date || plan.programResults[0].date;

        html = `
          <h2 class="text-xl font-bold text-slate-900 mb-4">Summary Comparison</h2>
          <div class="grid grid-cols-2 gap-6">
            <!-- Unconstrained Column -->
            <div class="border-2 border-blue-200 rounded-lg p-4 bg-blue-50">
              <h3 class="text-lg font-bold text-blue-900 mb-3 text-center">🔓 Unconstrained</h3>
              <div class="space-y-3">
                <div class="bg-white p-3 rounded-lg">
                  <div class="text-xs text-slate-600 mb-1">Total Input</div>
                  <div class="text-xl font-bold text-blue-900">${formatNumber(unconstrainedLastDay.cum_input)}</div>
                  <div class="text-xs text-blue-600 mt-1">As of ${unconstrainedLastDay.date}</div>
                </div>
                <div class="bg-white p-3 rounded-lg">
                  <div class="text-xs text-slate-600 mb-1">Total Output</div>
                  <div class="text-xl font-bold text-green-900">${formatNumber(unconstrainedLastDay.cum_output)}</div>
                  <div class="text-xs text-green-600 mt-1">As of ${unconstrainedLastDay.date}</div>
                </div>
                <div class="bg-white p-3 rounded-lg">
                  <div class="text-xs text-slate-600 mb-1">Total Shipment</div>
                  <div class="text-xl font-bold text-purple-900">${formatNumber(unconstrainedTotalShipment)}</div>
                  <div class="text-xs text-purple-600 mt-1">Starting ${shipmentStartDate}</div>
                </div>
                <div class="bg-white p-3 rounded-lg">
                  <div class="text-xs text-slate-600 mb-1">Attainment</div>
                  <div class="text-xl font-bold ${unconstrainedAttainment >= 100 ? 'text-green-600' : 'text-orange-600'}">${unconstrainedAttainment.toFixed(1)}%</div>
                </div>
                <div class="bg-white p-3 rounded-lg ${unconstrainedGap >= 0 ? 'border-2 border-green-300' : 'border-2 border-red-300'}">
                  <div class="text-xs text-slate-600 mb-1">Gap vs Demand</div>
                  <div class="text-xl font-bold ${unconstrainedGap >= 0 ? 'text-green-700' : 'text-red-700'}">
                    ${unconstrainedGap >= 0 ? '✅ +' : '⚠️ '}${formatNumber(unconstrainedGap)}
                  </div>
                </div>
              </div>
            </div>

            <!-- Constrained Column -->
            <div class="border-2 border-orange-200 rounded-lg p-4 bg-orange-50">
              <h3 class="text-lg font-bold text-orange-900 mb-3 text-center">🔒 Constrained</h3>
              <div class="space-y-3">
                <div class="bg-white p-3 rounded-lg">
                  <div class="text-xs text-slate-600 mb-1">Total Input</div>
                  <div class="text-xl font-bold text-blue-900">${formatNumber(lastDay.cum_input)}</div>
                  <div class="text-xs mt-1 ${lastDay.cum_input < unconstrainedLastDay.cum_input ? 'text-red-600' : 'text-green-600'}">
                    ${lastDay.cum_input < unconstrainedLastDay.cum_input ? '↓' : '='} ${formatNumber(lastDay.cum_input - unconstrainedLastDay.cum_input)}
                  </div>
                </div>
                <div class="bg-white p-3 rounded-lg">
                  <div class="text-xs text-slate-600 mb-1">Total Output</div>
                  <div class="text-xl font-bold text-green-900">${formatNumber(lastDay.cum_output)}</div>
                  <div class="text-xs mt-1 ${lastDay.cum_output < unconstrainedLastDay.cum_output ? 'text-red-600' : 'text-green-600'}">
                    ${lastDay.cum_output < unconstrainedLastDay.cum_output ? '↓' : '='} ${formatNumber(lastDay.cum_output - unconstrainedLastDay.cum_output)}
                  </div>
                </div>
                <div class="bg-white p-3 rounded-lg">
                  <div class="text-xs text-slate-600 mb-1">Total Shipment</div>
                  <div class="text-xl font-bold text-purple-900">${formatNumber(totalShipment)}</div>
                  <div class="text-xs mt-1 ${totalShipment < unconstrainedTotalShipment ? 'text-red-600' : 'text-green-600'}">
                    ${totalShipment < unconstrainedTotalShipment ? '↓' : '='} ${formatNumber(totalShipment - unconstrainedTotalShipment)}
                  </div>
                </div>
                <div class="bg-white p-3 rounded-lg">
                  <div class="text-xs text-slate-600 mb-1">Attainment</div>
                  <div class="text-xl font-bold ${attainment >= 100 ? 'text-green-600' : 'text-orange-600'}">${attainment.toFixed(1)}%</div>
                  <div class="text-xs mt-1 ${attainment < unconstrainedAttainment ? 'text-red-600' : 'text-green-600'}">
                    ${attainment < unconstrainedAttainment ? '↓' : '='} ${(attainment - unconstrainedAttainment).toFixed(1)}%
                  </div>
                </div>
                <div class="bg-white p-3 rounded-lg ${gap >= 0 ? 'border-2 border-green-300' : 'border-2 border-red-300'}">
                  <div class="text-xs text-slate-600 mb-1">Gap vs Demand</div>
                  <div class="text-xl font-bold ${gap >= 0 ? 'text-green-700' : 'text-red-700'}">
                    ${gap >= 0 ? '✅ +' : '⚠️ '}${formatNumber(gap)}
                  </div>
                  <div class="text-xs mt-1 ${gap < unconstrainedGap ? 'text-red-600' : 'text-green-600'}">
                    ${gap < unconstrainedGap ? '↓' : '='} ${formatNumber(gap - unconstrainedGap)}
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Impact Summary -->
          <div class="mt-4 p-4 bg-yellow-50 border-2 border-yellow-300 rounded-lg">
            <div class="font-semibold text-yellow-900 mb-2">⚡ Constraint Impact:</div>
            <div class="text-sm text-yellow-800">
              Constraints reduced total output by <strong>${formatNumber(unconstrainedLastDay.cum_output - lastDay.cum_output)}</strong> units
              (${((1 - lastDay.cum_output / unconstrainedLastDay.cum_output) * 100).toFixed(1)}% reduction),
              resulting in a ${formatNumber(unconstrainedGap - gap)} units worse gap vs demand.
            </div>
          </div>
        `;
      } else {
        // Standard single-mode summary
        const firstDay = plan.programResults[0];
        const shipmentStartDate = plan.programResults.find(d => d.shipment_final > 0)?.date || firstDay.date;

        html = `
          <h2 class="text-xl font-bold text-slate-900 mb-4">Plan Summary</h2>
          <div class="grid grid-cols-4 gap-4 mb-6">
            <div class="text-center p-4 bg-blue-50 rounded-lg">
              <div class="text-2xl font-bold text-blue-900">${formatNumber(lastDay.cum_input)}</div>
              <div class="text-sm text-blue-700 mt-1">Total Input</div>
              <div class="text-xs text-blue-600 mt-1">As of ${lastDay.date}</div>
            </div>
            <div class="text-center p-4 bg-green-50 rounded-lg">
              <div class="text-2xl font-bold text-green-900">${formatNumber(lastDay.cum_output)}</div>
              <div class="text-sm text-green-700 mt-1">Total Output</div>
              <div class="text-xs text-green-600 mt-1">As of ${lastDay.date}</div>
            </div>
            <div class="text-center p-4 bg-purple-50 rounded-lg">
              <div class="text-2xl font-bold text-purple-900">${formatNumber(totalShipment)}</div>
              <div class="text-sm text-purple-700 mt-1">Total Shipment</div>
              <div class="text-xs text-purple-600 mt-1">Starting ${shipmentStartDate}</div>
            </div>
            <div class="text-center p-4 bg-orange-50 rounded-lg">
              <div class="text-2xl font-bold text-orange-900">${formatNumber(totalDemand)}</div>
              <div class="text-sm text-orange-700 mt-1">Total Demand</div>
              <div class="text-xs text-orange-600 mt-1">Period total</div>
            </div>
          </div>

          <div class="flex items-center justify-between p-4 ${gap >= 0 ? 'bg-green-50 border-green-200' : 'bg-red-50 border-red-200'} border-2 rounded-lg">
            <div>
              <div class="font-semibold text-lg ${gap >= 0 ? 'text-green-900' : 'text-red-900'}">
                ${gap >= 0 ? '✅' : '⚠️'} Plan vs Demand Gap: ${gap >= 0 ? '+' : ''}${formatNumber(gap)} units
              </div>
              <div class="text-sm ${gap >= 0 ? 'text-green-700' : 'text-red-700'} mt-1">
                Attainment: ${attainment.toFixed(1)}%
              </div>
            </div>
          </div>
        `;
      }

      container.innerHTML = html;
    }

    function renderDailyResults(programResults, unconstrainedResults) {
      const tbody = document.getElementById('dailyResultsBody');
      const thead = document.getElementById('dailyResultsTable').querySelector('thead tr');

      // Update header if Combined Mode
      if (unconstrainedResults) {
        thead.innerHTML = `
          <th class="px-4 py-3 text-left sticky left-0 bg-slate-100">Date</th>
          <th class="px-2 py-3 text-right text-xs bg-blue-50 border-l-2 border-blue-300" colspan="3">🔓 Unconstrained</th>
          <th class="px-2 py-3 text-right text-xs bg-orange-50 border-l-2 border-orange-300" colspan="3">🔒 Constrained</th>
        `;
      } else {
        thead.innerHTML = `
          <th class="px-4 py-3 text-left">Date</th>
          <th class="px-4 py-3 text-right">Input</th>
          <th class="px-4 py-3 text-right">Output</th>
          <th class="px-4 py-3 text-right">Shipment</th>
          <th class="px-4 py-3 text-right">Cum Input</th>
          <th class="px-4 py-3 text-right">Cum Output</th>
          <th class="px-4 py-3 text-right">Cum Shipment</th>
        `;
      }

      let html = '';

      if (unconstrainedResults) {
        // Combined mode: show side-by-side comparison
        programResults.forEach((day, idx) => {
          const uncDay = unconstrainedResults[idx];
          const hasDiff = uncDay && (
            day.output_final !== uncDay.output_final ||
            day.cum_output !== uncDay.cum_output
          );

          html += `
            <tr class="border-t hover:bg-slate-50 ${hasDiff ? 'bg-yellow-50' : ''}">
              <td class="px-4 py-3 sticky left-0 bg-white font-medium">${formatDate(day.date)}</td>
              <!-- Unconstrained -->
              <td class="px-2 py-2 text-right text-xs bg-blue-50 border-l-2 border-blue-200">${uncDay ? formatNumber(uncDay.output_final) : '-'}</td>
              <td class="px-2 py-2 text-right text-xs bg-blue-50">${uncDay ? formatNumber(uncDay.shipment_final) : '-'}</td>
              <td class="px-2 py-2 text-right text-xs font-semibold bg-blue-50">${uncDay ? formatNumber(uncDay.cum_output) : '-'}</td>
              <!-- Constrained -->
              <td class="px-2 py-2 text-right text-xs bg-orange-50 border-l-2 border-orange-200 ${hasDiff ? 'text-red-600 font-bold' : ''}">${formatNumber(day.output_final)}</td>
              <td class="px-2 py-2 text-right text-xs bg-orange-50">${formatNumber(day.shipment_final)}</td>
              <td class="px-2 py-2 text-right text-xs font-semibold bg-orange-50 ${hasDiff ? 'text-red-600 font-bold' : ''}">${formatNumber(day.cum_output)}</td>
            </tr>
          `;
        });
      } else {
        // Standard mode
        programResults.forEach(day => {
          html += `
            <tr class="border-t hover:bg-slate-50">
              <td class="px-4 py-3">${formatDate(day.date)}</td>
              <td class="px-4 py-3 text-right">${formatNumber(day.input_final)}</td>
              <td class="px-4 py-3 text-right">${formatNumber(day.output_final)}</td>
              <td class="px-4 py-3 text-right">${formatNumber(day.shipment_final)}</td>
              <td class="px-4 py-3 text-right font-semibold">${formatNumber(day.cum_input)}</td>
              <td class="px-4 py-3 text-right font-semibold">${formatNumber(day.cum_output)}</td>
              <td class="px-4 py-3 text-right font-semibold">${formatNumber(day.cum_shipment)}</td>
            </tr>
          `;
        });
      }

      tbody.innerHTML = html;
    }

    function renderWeeklyMetrics(weeklyMetrics, unconstrainedMetrics) {
      const tbody = document.getElementById('weeklyMetricsBody');
      const thead = document.getElementById('weeklyMetricsTable').querySelector('thead tr');

      // FIX: If demand is missing (all zeros), try to load from localStorage forecast data
      const totalDemand = weeklyMetrics.reduce((sum, w) => sum + (w.demand || 0), 0);
      if (totalDemand === 0) {
        console.log('[Report] Demand data is missing, attempting to load from forecast...');
        try {
          const forecastVersions = JSON.parse(localStorage.getItem('productionPlan_forecast_versions') || '[]');
          if (forecastVersions.length > 0) {
            const latestForecast = forecastVersions[forecastVersions.length - 1];
            console.log('[Report] Found forecast data:', latestForecast.fileName, 'with', latestForecast.data.length, 'weeks');

            // Create a map of week_id to demand_qty (both should be in yyyy/mm/dd format now)
            const demandMap = {};
            latestForecast.data.forEach(row => {
              demandMap[row.week_id] = row.weekly_forecast;
            });

            // Merge demand data into weeklyMetrics
            let matchCount = 0;
            weeklyMetrics.forEach(week => {
              if (demandMap[week.week_id]) {
                week.demand = demandMap[week.week_id];
                matchCount++;
              }
            });
            console.log('[Report] ✅ Successfully loaded demand data from forecast. Matched', matchCount, 'of', weeklyMetrics.length, 'weeks');
          }
        } catch (error) {
          console.error('[Report] Failed to load forecast data:', error);
        }
      }

      // Calculate cumulative values
      let cumInput = 0, cumOutput = 0, cumShipment = 0, cumDemand = 0;
      const metricsWithCum = weeklyMetrics.map(week => {
        cumInput += week.input || 0;
        cumOutput += week.output || 0;
        cumShipment += week.shipments || 0;
        cumDemand += week.demand || 0;
        const cumGap = cumShipment - cumDemand;
        const cumAttainment = cumDemand > 0 ? (cumShipment / cumDemand * 100) : 0;

        return {
          ...week,
          cum_input: cumInput,
          cum_output: cumOutput,
          cum_shipment: cumShipment,
          cum_demand: cumDemand,
          cum_gap: cumGap,
          cum_attainment: cumAttainment
        };
      });

      // Build header (weeks as columns)
      let headerHtml = '<th class="px-3 py-2 text-left bg-slate-200 sticky left-0 z-10">Metric</th>';
      metricsWithCum.forEach(week => {
        headerHtml += `<th class="px-3 py-2 text-center text-xs bg-slate-100 min-w-[90px]">${week.week_id}</th>`;
      });
      thead.innerHTML = headerHtml;

      // Build rows (metrics as rows)
      const metrics = [
        { label: 'Input', key: 'input', isCumulative: false },
        { label: 'Cum Input', key: 'cum_input', isCumulative: true, bold: true },
        { label: 'Output', key: 'output', isCumulative: false },
        { label: 'Cum Output', key: 'cum_output', isCumulative: true, bold: true },
        { label: 'Shipment', key: 'shipments', isCumulative: false },
        { label: 'Cum Shipment', key: 'cum_shipment', isCumulative: true, bold: true },
        { label: 'Demand', key: 'demand', isCumulative: false },
        { label: 'Cum Demand', key: 'cum_demand', isCumulative: true, bold: true },
        { label: 'Gap (Cum)', key: 'cum_gap', isGap: true, bold: true },
        { label: 'Attainment %', key: 'cum_attainment', isPercent: true }
      ];

      let bodyHtml = '';
      metrics.forEach(metric => {
        const rowClass = metric.isCumulative ? 'bg-blue-50' : '';
        const labelClass = metric.bold ? 'font-bold' : '';

        bodyHtml += `<tr class="border-t hover:bg-slate-100 ${rowClass}">`;
        bodyHtml += `<td class="px-3 py-2 text-left bg-slate-100 sticky left-0 z-10 ${labelClass}">${metric.label}</td>`;

        metricsWithCum.forEach(week => {
          const value = week[metric.key] || 0;
          let displayValue = '';
          let cellClass = 'px-3 py-2 text-right text-sm';

          if (metric.isPercent) {
            displayValue = value.toFixed(1) + '%';
            cellClass += value >= 100 ? ' text-green-700 font-semibold' : value >= 90 ? ' text-orange-700 font-semibold' : ' text-red-700 font-semibold';
          } else if (metric.isGap) {
            displayValue = (value >= 0 ? '+' : '') + formatNumber(value);
            cellClass += value >= 0 ? ' text-green-700 font-semibold' : ' text-red-700 font-semibold';
          } else {
            displayValue = formatNumber(value);
            if (metric.bold) cellClass += ' font-semibold';
          }

          bodyHtml += `<td class="${cellClass}">${displayValue}</td>`;
        });

        bodyHtml += '</tr>';
      });

      tbody.innerHTML = bodyHtml;
    }

      }

      html += `
              </tr>
            </tbody>
          </table>
        </div>
      </div>

        const urlParams = new URLSearchParams(window.location.search);
        const planId = urlParams.get('planId');

        if (!planId) {
          alert('Cannot export: No plan ID found.');
          return;
        }

        // Try to get simulation from SimulationManager
        if (typeof SimulationManager !== 'undefined') {
          const simulation = SimulationManager.getSimulationById(planId);
          if (simulation) {
            // Use ExcelExport module
            if (typeof ExcelExport !== 'undefined' && ExcelExport.exportSimulation) {
              ExcelExport.exportSimulation(simulation);
              return;
            }
          }

          // Try to get POR if it matches the planId
          const currentPOR = SimulationManager.getCurrentPOR();
          if (currentPOR && currentPOR.id === planId) {
            if (typeof ExcelExport !== 'undefined' && ExcelExport.exportPOR) {
              ExcelExport.exportPOR(currentPOR);
              return;
            }
          }
        }

        // Fallback: export directly from localStorage data
        const planDataStr = localStorage.getItem('productionPlan_' + planId);
        if (planDataStr) {
          const planData = JSON.parse(planDataStr);

          // Create a temporary simulation object for export
          const tempSimulation = {
            id: planId,
            name: 'Production Plan Report',
            createdAt: planData.generatedAt || new Date().toISOString(),
            config: planData.config || {},
            results: planData.results || planData
          };

          if (typeof ExcelExport !== 'undefined' && ExcelExport.exportSimulation) {
            ExcelExport.exportSimulation(tempSimulation);
            return;
          }
        }

        // If all else fails
        alert('Excel export module not available. Please make sure the page loaded correctly.');
      } catch (error) {
        console.error('[Report] Excel export error:', error);
        alert('Failed to export Excel file: ' + error.message);
      }
    }

    function backToSimulationLibrary() {
      try {
        // Check if window.opener exists
        if (window.opener && !window.opener.closed) {
          // First, navigate to Production Plan view using Router
          if (window.opener.Router && window.opener.Router.navigate) {
            window.opener.Router.navigate('production-plan');
          } else if (window.opener.location) {
            // Fallback: directly set hash
            window.opener.location.hash = '#/mo-dashboard';
          }

          // Then switch to Simulation Library tab
          setTimeout(() => {
            if (window.opener.switchProductionPlanTab) {
              window.opener.switchProductionPlanTab('library');
            } else if (window.opener.productionPlanState) {
              // Fallback: manually set the active tab
              window.opener.productionPlanState.activeTab = 'library';
              if (window.opener.renderProductionPlan) {
                window.opener.renderProductionPlan();
              }
            }
          }, 100);

          // Wait a bit then close current window
          setTimeout(() => {
            window.close();
          }, 400);
        } else {
          // If no opener, just close the window
          window.close();
        }
      } catch (error) {
        console.error('[Report] Back to library error:', error);
        // Still try to close the window
        window.close();
      }
    }

    // Initialize report on page load
    window.addEventListener('DOMContentLoaded', renderReport);
  </script>
</body>
</html>
